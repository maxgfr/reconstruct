name: Engine re-pin

# Nightly check for a new maxgfr/codeindex release. When one exists, vendor +
# rebuild it, run the same gate the CI/release workflows run, and — only if
# every gate is green — push straight to main and kick off release.yml
# ourselves (a bot push does not trigger other workflows on its own). If any
# gate fails, nothing is pushed and no PR is opened — the run just fails
# and the next daily cron retries; a red run is the signal to investigate.
on:
  schedule:
    - cron: "52 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write
  issues: write

concurrency: engine-repin

jobs:
  repin:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # Driven by `sync-engine.mjs --list` rather than by a copy of the engine
      # table kept here: adding an engine to the script is then the only edit
      # needed, and the automation cannot drift from the list it is watching.
      - name: Re-pin every engine that has a newer release
        id: detect
        run: |
          set -euo pipefail
          SUMMARY=""
          while read -r NAME REPO PINNED; do
            # NOT releases/latest: a repo may also publish non-engine asset
            # releases (codeindex publishes embed-model-v1), which are not tags
            # this can pin to.
            LATEST=$(gh api "repos/${REPO}/releases" --jq '[.[] | select(.tag_name | test("^v[0-9]")) | .tag_name] | first')
            if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
              echo "::error::could not determine the latest ${NAME} release tag"
              exit 1
            fi
            if [ "$PINNED" = "$LATEST" ]; then
              echo "${NAME}: up to date (${PINNED})"
              continue
            fi
            echo "${NAME}: ${PINNED} -> ${LATEST}"
            node scripts/sync-engine.mjs --engine "$NAME" --ref "$LATEST"
            SUMMARY="${SUMMARY}${NAME} ${PINNED} -> ${LATEST}"$'\n'
          done < <(node scripts/sync-engine.mjs --list)

          if [ -z "$SUMMARY" ]; then
            echo "repin=false" >> "$GITHUB_OUTPUT"
          else
            echo "repin=true" >> "$GITHUB_OUTPUT"
            {
              echo "summary<<EOF"
              printf '%s' "$SUMMARY"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the vendored engines match their new pins
        if: steps.detect.outputs.repin == 'true'
        run: node scripts/sync-engine.mjs --check

      - name: Install dependencies
        if: steps.detect.outputs.repin == 'true'
        run: pnpm install --frozen-lockfile

      - name: Rebuild the bundle against the new engine
        if: steps.detect.outputs.repin == 'true'
        run: pnpm run build # tsup && copy-bundle.mjs

      - name: Stage the re-pinned + rebuilt outputs
        # Staged *before* the check:build gate below, and before any gate can
        # fail, so (a) check:build's internal `git diff` against the index
        # verifies build reproducibility rather than flagging our own
        # intentional bump, and (b) the failure path always has committable
        # adjudication material regardless of which later gate trips.
        if: steps.detect.outputs.repin == 'true'
        run: |
          git add src/vendor/engine.meta.json src/vendor/codeindex-engine.mjs src/vendor/codeindex-engine.d.mts scripts/analyze.mjs skills/reconstruct/scripts/analyze.mjs

      - name: Typecheck
        if: steps.detect.outputs.repin == 'true'
        run: pnpm run typecheck

      - name: Lint
        if: steps.detect.outputs.repin == 'true'
        run: pnpm run lint # biome ci .

      - name: Build is reproducible (committed bundle up to date)
        if: steps.detect.outputs.repin == 'true'
        run: pnpm run check:build # sync-engine --check && tsup && diff && verify-skill-bundle

      - name: Test
        if: steps.detect.outputs.repin == 'true'
        run: pnpm test

      - name: Smoke-run the committed bundle
        if: steps.detect.outputs.repin == 'true'
        run: pnpm run demo

      - name: Assert reconstruction output was produced
        if: steps.detect.outputs.repin == 'true'
        run: test -f /tmp/reconstruct-demo/inventory.json && test -f /tmp/reconstruct-demo/REBUILD.md

      - name: Golden example passes the full semantic gate (read-only)
        if: steps.detect.outputs.repin == 'true'
        run: node scripts/analyze.mjs --check --semantic --out assets/example-output

      - name: Convergence/parity (scratch path, buildable-by-construction)
        if: steps.detect.outputs.repin == 'true'
        run: pnpm run parity

      - name: All gates green — commit and push the re-pin to main
        if: steps.detect.outputs.repin == 'true'
        id: push
        env:
          ENGINES: ${{ steps.detect.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SUMMARY="$(git diff --cached --stat | tail -n 1)"
          git commit -m "feat(engine): re-pin vendored engines" -m "automated re-pin, all gates green, goldens byte-identical" -m "${ENGINES}$SUMMARY"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger release.yml (a bot push does not fire other workflows)
        if: steps.detect.outputs.repin == 'true'
        run: gh workflow run release.yml --ref main

      - name: Trigger ci.yml
        if: steps.detect.outputs.repin == 'true'
        run: gh workflow run ci.yml --ref main

      # A red re-pin means this repo has stopped following the engine. Nothing
      # used to carry that signal out of the Actions tab, so ultrasec failed
      # three nights running in August before a human noticed. One open issue per
      # repo, a comment on each further failure, closed by the first green run.
      - name: Report the failure on the tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh label create engine-repin --color B60205 --description "This automated pin needs a human" --force >/dev/null 2>&1 || true
          NUM=$(gh issue list --state open --label engine-repin --limit 1 --json number --jq '.[0].number // empty')
          # Built with printf rather than a multi-line literal: this file's own
          # indentation would otherwise be carried into the body and render the
          # whole message as a code block.
          BODY=$(printf '%s\n\n%s\n' \
            "The daily engine-repin run failed: ${RUN}" \
            "Nothing was pushed, so main is not broken — the pin is simply frozen where it was, and this repo stays behind the engine until someone looks.")
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "${{ github.workflow }} is failing" --label engine-repin --body "$BODY"
          fi

      - name: Close the tracking issue once a run is green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUM=$(gh issue list --state open --label engine-repin --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then exit 0; fi
          gh issue close "$NUM" --comment "Green again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
